<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malla Ingeniería Civil en Obras Civiles</title>
<style>
  :root {
    /* Nueva Paleta Titanium Slate Professional */
    --bg-base: #090d16;
    --panel-bg: #111827;
    --panel-card: #1f2937;
    --panel-hover: #374151;
    
    --text-primary: #f9fafb;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    
    /* Acentos cromáticos moderados */
    --accent-teal: #0d9488;
    --accent-teal-glow: rgba(13, 148, 136, 0.15);
    
    --status-passed: #10b981;
    --status-passed-bg: rgba(16, 185, 129, 0.12);
    
    --status-progress: #f59e0b;
    --status-progress-bg: rgba(245, 158, 11, 0.12);
    
    --status-failed: #ef4444;
    --status-failed-bg: rgba(239, 68, 68, 0.12);
    
    --status-pending: #6b7280;
    --status-pending-bg: rgba(107, 114, 128, 0.12);

    --border-color: #1f2937;
    --border-subtle: #374151;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    padding-bottom: 90px;
    min-height: 100vh;
  }

  /* HEADER EJECUTIVO */
  header {
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border-color);
    padding: 16px 20px;
    text-align: center;
    margin-bottom: 16px;
  }

  .header-container {
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .main-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .career-badge {
    background: var(--accent-teal-glow);
    color: var(--accent-teal);
    border: 1px solid rgba(13, 148, 136, 0.3);
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
  }

  /* NAVBAR BOTTOM GLASSMORPHISM */
  nav.navbar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 380px;
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    display: flex;
    justify-content: space-around;
    padding: 6px;
    z-index: 1000;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 16px;
    border-radius: 10px;
    transition: all 0.2s;
  }

  .nav-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .nav-btn.active {
    color: #ffffff;
    background: var(--panel-card);
    border: 1px solid var(--border-subtle);
  }

  /* PESTAÑAS */
  .tab-content { display: none; padding: 0 16px; max-width: 1600px; margin: 0 auto; }
  .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* DASHBOARD KPI STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .kpi-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kpi-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .kpi-title { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi-icon { width: 14px; height: 14px; fill: var(--text-muted); }

  .kpi-value { font-size: 1.15rem; font-weight: 800; color: var(--text-primary); }

  .progress-bar-wrapper {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--panel-card);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-teal), #3b82f6);
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 10px;
  }

  /* GRID MALLA */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(10, minmax(180px, 1fr));
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 12px;
  }

  .level-column {
    background: rgba(17, 24, 39, 0.4);
    border-radius: 10px;
    padding: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
  }

  .level-header {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 6px 8px;
    background: var(--panel-bg);
    border-radius: 6px;
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* TARJETAS DE ASIGNATURA COMPACTAS */
  .course-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }

  .course-card:hover {
    border-color: var(--border-subtle);
    background: var(--panel-card);
  }

  .course-title {
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--text-primary);
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }

  .status-tag {
    font-size: 0.55rem;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .credits-tag {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  /* ESTADOS */
  .status-tag.pending { background: var(--status-pending-bg); color: var(--status-pending); }
  .status-tag.in_progress { background: var(--status-progress-bg); color: var(--status-progress); }
  .status-tag.passed { background: var(--status-passed-bg); color: var(--status-passed); }
  .status-tag.failed { background: var(--status-failed-bg); color: var(--status-failed); }

  .course-card.passed { border-color: rgba(16, 185, 129, 0.3); }
  .course-card.in_progress { border-color: rgba(245, 158, 11, 0.3); }
  .course-card.failed { border-color: rgba(239, 68, 68, 0.3); }

  .course-card.prereq-highlight { border-color: var(--status-progress) !important; background: rgba(245, 158, 11, 0.1) !important; }
  .course-card.unlocks-highlight { border-color: #a855f7 !important; background: rgba(168, 85, 247, 0.1) !important; }
  .course-card.active-selected { border-color: #38bdf8 !important; }

  /* TOOLTIP */
  .custom-tooltip {
    position: absolute;
    bottom: 105%;
    left: 50%;
    transform: translateX(-50%);
    background: #1f2937;
    color: var(--text-primary);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.65rem;
    width: max-content;
    max-width: 180px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    border: 1px solid var(--border-subtle);
    z-index: 100;
    pointer-events: none;
    display: none;
    line-height: 1.3;
  }

  .course-card:hover .custom-tooltip { display: block; }

  /* REDISEÑO PROFESIONAL DEL HORARIO */
  .horario-toolbar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .form-control {
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    outline: none;
    flex: 1;
    min-width: 140px;
  }

  .btn-submit {
    background: var(--text-primary);
    color: var(--bg-base);
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-submit:hover { opacity: 0.9; }

  .calendar-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(160px, 1fr));
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .day-column-pro {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 160px;
  }

  .day-header-pro {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
  }

  .class-block-pro {
    background: var(--panel-card);
    border: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent-teal);
    border-radius: 6px;
    padding: 8px 10px;
    position: relative;
  }

  .class-time {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--accent-teal);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }

  .class-name {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.25;
  }

  .btn-remove-block {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
  }

  .btn-remove-block:hover { color: var(--status-failed); }

  /* EVALUACIONES LISTA */
  .eval-card-pro {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-left: 3px solid var(--status-progress);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="main-title">
      Malla Curricular
      <span class="career-badge">Ingeniería Civil en Obras Civiles</span>
    </div>
  </div>
</header>

<!-- NAVEGACIÓN FLOTANTE -->
<nav class="navbar">
  <button class="nav-btn active" onclick="switchTab('mallaTab', this)">
    <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
    <span>Malla</span>
  </button>
  <button class="nav-btn" onclick="switchTab('horarioTab', this)">
    <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>

</nav>

    <div class="kpi-card">

    </div>
    <div class="kpi-card">

      </div>
      <div class="kpi-value" id="progressPercent">0%</div>
    </div>
  </div>

  <div class="progress-bar-wrapper">
    <div class="progress-track"><div class="progress-fill" id="progressBar"></div></div>
  </div>

  <div class="grid-container" id="mallaGrid"></div>
</div>

<!-- TAB 2: HORARIO PROFESIONAL -->
<div id="horarioTab" class="tab-content">
  <div class="horario-toolbar">
    <select id="horarioDia" class="form-control">
      <option value="Lunes">Lunes</option>
      <option value="Martes">Martes</option>
      <option value="Miércoles">Miércoles</option>
      <option value="Jueves">Jueves</option>
      <option value="Viernes">Viernes</option>
    </select>
    <input type="text" id="horarioHora" class="form-control" placeholder="Módulo (ej: 8:30 - 9:40)">
    <input type="text" id="horarioRamo" class="form-control" placeholder="Asignatura">
    <button class="btn-submit" onclick="agregarBloqueHorario()">Añadir Módulo</button>
  </div>

  <div class="calendar-board" id="horarioGrid"></div>
</div>

<!-- TAB 3: EVALUACIONES -->
<div id="evalTab" class="tab-content">
  <div class="horario-toolbar">
    <input type="text" id="evalNombre" class="form-control" placeholder="Evaluación / Asignatura">
    <input type="date" id="evalFecha" class="form-control">
    <button class="btn-submit" onclick="agregarEvaluacion()">Registrar Fecha</button>
  </div>
  <div id="evalList"></div>
</div>

<script>
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

const TOTAL_CREDITS_CAREER = coursesData.reduce((sum, c) => sum + c.credits, 0);
const statusOrder = ["pending", "in_progress", "passed", "failed"];
const statusLabels = { pending: "Pendiente", in_progress: "Cursando", passed: "Aprobado", failed: "Reprobado" };
let courseStatus = JSON.parse(localStorage.getItem('malla_course_status') || '{}');

function saveMallaState() { localStorage.setItem('malla_course_status', JSON.stringify(courseStatus)); }
function getCourseById(id) { return coursesData.find(c => c.id === id); }

function renderMalla() {
  const container = document.getElementById('mallaGrid');
  container.innerHTML = '';

  for (let lvl = 1; lvl <= 10; lvl++) {
    const col = document.createElement('div');
    col.className = 'level-column';
    
    const levelCourses = coursesData.filter(c => c.level === lvl);
    const semCredits = levelCourses.reduce((sum, c) => sum + c.credits, 0);

    const header = document.createElement('div');
    header.className = 'level-header';
    header.innerHTML = `<span>Semestre ${lvl}</span><span style="color: var(--text-muted);">${semCredits} cr.</span>`;
    col.appendChild(header);

    levelCourses.forEach(course => {
      const currentStatus = courseStatus[course.id] || "pending";
      const card = document.createElement('div');
      card.className = `course-card ${currentStatus}`;
      card.dataset.id = course.id;

      const title = document.createElement('div');
      title.className = 'course-title';
      title.innerText = course.name;
      card.appendChild(title);

      const footer = document.createElement('div');
      footer.className = 'card-footer';

      const badge = document.createElement('div');
      badge.className = `status-tag ${currentStatus}`;
      badge.innerText = statusLabels[currentStatus];
      footer.appendChild(badge);

      const credits = document.createElement('div');
      credits.className = 'credits-tag';
      credits.innerText = `${course.credits} cr.`;
      footer.appendChild(credits);

      card.appendChild(footer);

      if (course.prereqs.length > 0) {
        let text = course.id === "c4_8" ? "Req: Sem. 1 y 2" : (course.id === "c6_7" ? "Req: Sem. 1-5" : (course.id === "c8_5" || course.id === "c8_7" ? "Req: Sem. 1-7" : `Req: ${course.prereqs.map(pId => getCourseById(pId)?.name || pId).join(', ')}`));
        const tooltip = document.createElement('div');
        tooltip.className = 'custom-tooltip';
        tooltip.innerText = text;
        card.appendChild(tooltip);
      }

      card.addEventListener('click', () => {
        const nextIndex = (statusOrder.indexOf(currentStatus) + 1) % statusOrder.length;
        courseStatus[course.id] = statusOrder[nextIndex];
        saveMallaState();
        renderMalla();
        updateStats();
        highlightPrereqs(course.id);
      });

      card.addEventListener('mouseenter', () => highlightPrereqs(course.id));
      card.addEventListener('mouseleave', clearHighlights);

      col.appendChild(card);
    });

    container.appendChild(col);
  }
  updateStats();
}

function highlightPrereqs(targetId) {
  clearHighlights();
  document.querySelector(`[data-id="${targetId}"]`)?.classList.add('active-selected');

  function getParents(id) {
    const c = getCourseById(id);
    if (!c) return [];
    let pList = [...c.prereqs];
    c.prereqs.forEach(pId => pList = pList.concat(getParents(pId)));
    return pList;
  }
  [...new Set(getParents(targetId))].forEach(pId => document.querySelector(`[data-id="${pId}"]`)?.classList.add('prereq-highlight'));

  function getChildren(id) {
    const children = coursesData.filter(c => c.prereqs.includes(id)).map(c => c.id);
    let allChilds = [...children];
    children.forEach(cId => allChilds = allChilds.concat(getChildren(cId)));
    return allChilds;
  }
  [...new Set(getChildren(targetId))].forEach(uId => document.querySelector(`[data-id="${uId}"]`)?.classList.add('unlocks-highlight'));
}

function clearHighlights() {
  document.querySelectorAll('.course-card').forEach(card => card.classList.remove('prereq-highlight', 'unlocks-highlight', 'active-selected'));
}

function updateStats() {
  let passed = 0, inProgress = 0, failed = 0, pending = 0;
  let passedCredits = 0;

  coursesData.forEach(c => {
    const st = courseStatus[c.id] || "pending";
    if (st === "passed") {
      passed++;
      passedCredits += c.credits;
    }
    else if (st === "in_progress") inProgress++;
    else if (st === "failed") failed++;
    else pending++;
  });

  const percent = Math.round((passedCredits / TOTAL_CREDITS_CAREER) * 100);
  document.getElementById('passedCreditsCount').innerText = `${passedCredits} / ${TOTAL_CREDITS_CAREER}`;
  document.getElementById('passedCount').innerText = passed;
  document.getElementById('inProgressCount').innerText = inProgress;
  document.getElementById('failedCount').innerText = failed;
  document.getElementById('pendingCount').innerText = pending;
  document.getElementById('progressPercent').innerText = `${percent}%`;
  document.getElementById('progressBar').style.width = `${percent}%`;
}

function agregarBloqueHorario() {
  const dia = document.getElementById('horarioDia').value;
  const hora = document.getElementById('horarioHora').value;
  const ramo = document.getElementById('horarioRamo').value;

  if (!hora || !ramo) return;

  horarioData.push({ id: Date.now(), dia, hora, ramo });
  document.getElementById('horarioHora').value = '';
  document.getElementById('horarioRamo').value = '';
  saveHorarioState();
}

function eliminarBloqueHorario(id) {
  horarioData = horarioData.filter(h => h.id !== id);
  saveHorarioState();
}

function renderHorario() {
  const container = document.getElementById('horarioGrid');
  container.innerHTML = '';

  diasSemana.forEach(dia => {
    const col = document.createElement('div');
    col.className = 'day-column-pro';

    const header = document.createElement('div');
    header.className = 'day-header-pro';
    header.innerText = dia;
    col.appendChild(header);

    const bloques = horarioData.filter(h => h.dia === dia);
    bloques.forEach(b => {
      const card = document.createElement('div');
      card.className = 'class-block-pro';
      card.innerHTML = `
        <div class="class-time">
          <span>${b.hora}</span>
          <button class="btn-remove-block" onclick="eliminarBloqueHorario(${b.id})">✕</button>
        </div>
        <div class="class-name">${b.ramo}</div>
      `;
      col.appendChild(card);
    });

    container.appendChild(col);
  });
}

function eliminarEvaluacion(id) {

      <button onclick="eliminarEvaluacion(${e.id})" class="btn-remove-block">✕</button>
    `;
    container.appendChild(card);
  });
}
